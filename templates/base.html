<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normalización y Exploración de Transacciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col font-sans">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-sky-400 flex items-center gap-2">
                <span>⚡</span> Sistema Multifuente de Transacciones
            </h1>
            <span class="text-xs font-semibold px-2.5 py-1 bg-sky-950 text-sky-300 border border-sky-800 rounded-full">Procesamiento en Tiempo Real</span>
        </div>
    </header>
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
